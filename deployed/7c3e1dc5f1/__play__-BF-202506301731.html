<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>元气骑士 - Roguelike版</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      max-width: 640px;
      width: 100%;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .badge {
      display: inline-block;
      background: #7c3aed;
      color: white;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { line-height: 1.7; color: #94a3b8; }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #0b1220;
      border: 1px solid #334155;
      border-radius: 10px;
    }
    pre {
      padding: 14px 16px;
      overflow-x: auto;
      color: #cbd5e1;
      margin: 16px 0;
    }
    ul { padding-left: 1.2rem; color: #cbd5e1; }
    .note {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.35);
      color: #bfdbfe;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="badge">Pygame 桌面游戏</div>
    <h1>元气骑士 - Roguelike版</h1>
    <p>作者：夏陈楠 · 文档号 10</p>
    <p>该作品为 Python 桌面程序，无法在浏览器内直接运行。请下载压缩包后在本地启动。</p>
    <pre>pip install pygame
python "新建文件夹 (2)/game - 副本 - 副本 (4).py"</pre>
    <ul>
      <li>操作：W / A / S / D 移动，鼠标瞄准与射击</li>
      <li>窗口标题：元气骑士 - Roguelike版</li>
      <li>入口文件：<code>新建文件夹 (2)/game - 副本 - 副本 (4).py</code></li>
    </ul>
    <div class="note">网页端可查看作品说明并评分；实际游玩需在本机运行上述命令。</div>
  </div>
</body>
</html>
