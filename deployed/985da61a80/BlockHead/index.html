<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockHead</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #mainMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 100;
        }

        #mainMenu h1 {
            font-size: 64px;
            color: #e94560;
            text-shadow: 0 0 30px rgba(233, 69, 96, 0.8);
            margin-bottom: 40px;
        }

        .menu-btn {
            display: block;
            width: 250px;
            padding: 15px 30px;
            font-size: 24px;
            background: linear-gradient(135deg, #e94560, #c0392b);
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 20px auto;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .menu-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
        }

        #levelSelect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 100;
            display: none;
        }

        #levelSelect h2 {
            font-size: 48px;
            color: #f39c12;
            text-shadow: 0 0 20px rgba(243, 156, 18, 0.8);
            margin-bottom: 40px;
        }

        .boss-card {
            display: inline-block;
            width: 200px;
            padding: 20px;
            margin: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
            border: 2px solid transparent;
        }

        .boss-card:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
            border-color: #e94560;
        }

        .boss-card img {
            width: 100px;
            height: 100px;
            margin-bottom: 15px;
            border-radius: 50%;
        }

        .boss-card h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .boss-card p {
            font-size: 14px;
            color: #aaa;
        }

        .back-btn {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #gameContainer {
            position: relative;
        }

        #gameCanvas {
            border: 4px solid #e94560;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .health-bar {
            width: 200px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            transition: width 0.3s;
        }

        .boss-health-bar {
            width: 400px;
            height: 25px;
            background: #333;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .boss-health-fill {
            height: 100%;
            background: linear-gradient(90deg, #9b59b6, #8e44ad);
            transition: width 0.3s;
        }

        #controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 14px;
            text-align: center;
        }

        #gameOver,
        #victory {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            display: none;
        }

        #gameOver h1 {
            color: #e94560;
            font-size: 48px;
            margin-bottom: 20px;
        }

        #victory h1 {
            color: #2ecc71;
            font-size: 48px;
            margin-bottom: 20px;
        }

        .restart-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .restart-btn:hover {
            background: #ff6b6b;
            transform: scale(1.1);
        }

        #dashCooldown {
            width: 60px;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }

        #dashCooldownFill {
            height: 100%;
            background: #3498db;
            width: 100%;
            transition: width 0.1s;
        }
    </style>
</head>

<body>
    <div id="mainMenu">
        <h1>BlockHead</h1>
        <button class="menu-btn" onclick="showLevelSelect()">选择关卡</button>
        <button class="menu-btn" onclick="startGame(0)">随机挑战</button>
    </div>

    <div id="levelSelect">
        <h2>选择Boss</h2>
        <div class="boss-card" onclick="startGame(0)">
            <div
                style="width:100px;height:100px;margin:0 auto 15px;border-radius:50%;background:linear-gradient(135deg,#9b59b6,#8e44ad);display:flex;align-items:center;justify-content:center;font-size:48px;">
                ☠️</div>
            <h3>暗影骑士</h3>
            <p>暗影系技能</p>
        </div>
        <div class="boss-card" onclick="startGame(1)">
            <div
                style="width:100px;height:100px;margin:0 auto 15px;border-radius:50%;background:linear-gradient(135deg,#e74c3c,#c0392b);display:flex;align-items:center;justify-content:center;font-size:48px;">
                🔥</div>
            <h3>火焰恶魔</h3>
            <p>火焰系技能</p>
        </div>
        <div class="boss-card" onclick="startGame(2)">
            <div
                style="width:100px;height:100px;margin:0 auto 15px;border-radius:50%;background:linear-gradient(135deg,#3498db,#2980b9);display:flex;align-items:center;justify-content:center;font-size:48px;">
                ❄️</div>
            <h3>冰霜巨人</h3>
            <p>冰霜系技能</p>
        </div>
        <br>
        <button class="back-btn" onclick="showMainMenu()">返回主菜单</button>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="1000" height="600"></canvas>
        <div id="ui">
            <div id="hearts" style="display: flex; gap: 5px; margin-bottom: 10px;">
                <span class="heart" style="font-size: 30px;">♥</span>
                <span class="heart" style="font-size: 30px;">♥</span>
                <span class="heart" style="font-size: 30px;">♥</span>
                <span class="heart" style="font-size: 30px;">♥</span>
                <span class="heart" style="font-size: 30px;">♥</span>
            </div>
            <div id="dashCooldown">
                <div id="dashCooldownFill"></div>
            </div>
            <div style="font-size: 12px; color: #3498db;">冲刺冷却</div>
            <div style="margin-top: 8px; font-size: 14px;">子弹: <span id="bulletType" style="color: #f39c12;">普通弹</span>
            </div>
        </div>
        <div style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); text-align: center;">
            <div class="boss-health-bar">
                <div class="boss-health-fill" id="bossHealth"></div>
            </div>
            <div style="color: #9b59b6; font-size: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
                <span id="bossName">Boss</span>
            </div>
        </div>
        <div id="controls">
            <p>操作: A/D 或 ←/→ 移动 | Z 跳跃 | C 冲刺(无敌) | X 射击 | ↑ 向上射击 | 空格 切换子弹类型 | V 蓄力技能</p>
        </div>
        <div id="gameOver">
            <h1>游戏结束</h1>
            <p style="font-size: 24px; margin-bottom: 20px;">你被击败了...</p>
            <button class="restart-btn" onclick="restartGame()">重新开始</button>
        </div>
        <div id="victory">
            <h1>胜利!</h1>
            <p style="font-size: 24px; margin-bottom: 20px;">你击败了Boss!</p>
            <button class="restart-btn" onclick="restartGame()">挑战下一个Boss</button>
        </div>
    </div>
    <script src="game.js?v=6"></script>
</body>

</html>
