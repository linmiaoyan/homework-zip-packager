    function handleMovement() {
      const gameArea = document.getElementById('gameArea');
      const gameAreaWidth = gameArea.offsetWidth;
      const playerWidth = 40;
      const edgeThreshold = 60; // 边缘触发距离
      
      if (isMovingLeft) {
        player.x -= player.stats.speed;
        player.facingRight = false;
        
        // 检查是否到达左边缘
        if (player.x <= edgeThreshold) {
          if (dungeon.currentRoom.isRoomCleared()) {
            const adjacent = dungeon.getAdjacentRooms();
            const leftRoom = adjacent.find(a => a.direction === 'left');
            if (leftRoom) {
              dungeon.moveToRoom('left');
              player.x = gameAreaWidth - edgeThreshold - playerWidth;
              updateUI();
            }
          } else {
            player.x = edgeThreshold; // 阻止继续移动
          }
        }
      }
      if (isMovingRight) {
        player.x += player.stats.speed;
        player.facingRight = true;
        
        // 检查是否到达右边缘
        if (player.x >= gameAreaWidth - edgeThreshold - playerWidth) {
          player.x = gameAreaWidth - edgeThreshold - playerWidth; // 阻止继续移动
        }
      }
      // 更新玩家位置显示
      const playerElement = document.getElementById('player');
      playerElement.style.left = player.x + 'px';
    }

    function nextFloor() {
      dungeon.nextFloor();
      player.x = 100; // 重置玩家位置到左侧
      changeBackground();
      updateUI();
    }

    function changeBackground() {
      const gameArea = document.getElementById('gameArea');
      
      // 70% 概率使用图片背景，30% 概率使用渐变背景
      if (Math.random() < 0.7 && dungeonBackgrounds.length > 0) {
        // 随机选择一个图片背景
        const randomIndex = Math.floor(Math.random() * dungeonBackgrounds.length);
        gameArea.style.background = dungeonBackgrounds[randomIndex];
        gameArea.style.backgroundSize = 'cover';
        gameArea.style.backgroundPosition = 'center';
        gameArea.style.backgroundRepeat = 'no-repeat';
      } else {
        // 使用原来的渐变背景
        const bgIndex = (dungeon.currentFloor - 1) % backgrounds.length;
        gameArea.style.background = backgrounds[bgIndex];
        gameArea.style.backgroundSize = 'auto';
      }
    }

    function updateUI() {
      const healthPercent = (player.stats.health / player.stats.maxHealth) * 100;
      document.getElementById('healthFill').style.width = healthPercent + '%';
      document.getElementById('healthText').textContent = Math.floor(player.stats.health) + ' / ' + player.stats.maxHealth;
      document.getElementById('floorText').textContent = `第 ${dungeon.currentFloor} 层 | Lv.${playerLevel}`;
      document.getElementById('goldText').textContent = '💰 ' + player.gold;
      document.getElementById('scoreText').textContent = '分数: ' + score;
      
      const playerElement = document.getElementById('player');
      const playerSprite = document.getElementById('playerSprite');
      
      playerElement.classList.toggle('invincible', player.isInvincible);
      
      // 更新玩家动画状态
      updatePlayerAnimation();
      
      updateRoomDisplay();
      updateInventory();
      updateDirectionHints();
    }
    
    function updatePlayerAnimation() {
      const playerSprite = document.getElementById('playerSprite');
      if (!playerSprite) return;
      
      // 清除所有状态类，但保留跳跃动画类，因为它有自己的时间控制
      playerSprite.classList.remove('idle', 'walking', 'attacking', 'hit', 'facing-left');
      
      // 添加对应状态类
      if (player.isAttacking) {
        playerSprite.classList.add('attacking');
      } else if (!player.isJumping && (isMovingLeft || isMovingRight)) {
        playerSprite.classList.add('walking');
      } else if (!player.isJumping) {
        playerSprite.classList.add('idle');
      }
      
      // 跳跃状态由playerJump函数单独处理
      if (player.isJumping && !playerSprite.classList.contains('jumping')) {
        playerSprite.classList.add('jumping');
      }
      
      // 面向方向
      if (!player.facingRight) {
        playerSprite.classList.add('facing-left');
      }
    }

    function updateRoomDisplay() {
      const room = dungeon.currentRoom;
      const messages = {
        start: { text: '欢迎来到地牢！', hint: '击败敌人，收集装备，挑战Boss！' },
        normal: { text: '战斗房间', hint: '击败所有敌人' },
        treasure: { text: '宝箱房间', hint: '收集珍贵物品' },
        shop: { text: '商店', hint: '购买强力装备' },
        boss: { text: 'Boss房间', hint: '击败Boss进入下一层' },
        rest: { text: '休息区', hint: '恢复全部生命值' }
      };

      document.getElementById('messageText').textContent = messages[room.type].text;
      document.getElementById('messageHint').textContent = messages[room.type].hint;
      document.getElementById('restBtn').style.display = room.type === 'rest' ? 'block' : 'none';

      // 更新敌人显示
      const enemiesContainer = document.getElementById('enemiesContainer');
      enemiesContainer.innerHTML = room.enemies.map(e => `
        <div class="enemy ${e.isAlive ? '' : 'dead'} ${e.type === 'frankenstein' || e.type === 'mummy' ? 'boss-enemy' : ''}" style="position: absolute; left: ${e.x}px; bottom: 50px;">
          ${e.getSprite()}
          <div class="enemy-health-bar">
            <div class="enemy-health-fill" style="width: ${(e.stats.health / e.stats.maxHealth * 100)}%"></div>
          </div>
        </div>
      `).join('');

      // 更新物品显示
      const itemsContainer = document.getElementById('itemsContainer');
      itemsContainer.innerHTML = room.items.map(item => `
        <div class="item" style="border-color: ${item.getRarityColor()}" onclick="collectItem('${item.id}')">
          <div class="item-icon">${item.icon}</div>
          <div class="item-name">${item.name}</div>
        </div>
      `).join('');
      
      // 更新地形显示
      const terrainContainer = document.getElementById('terrainContainer');
      terrainContainer.innerHTML = room.terrain.map(terrain => {
        switch (terrain.type) {
          case 'pillar':
            return `
              <div class="terrain pillar" style="left: ${terrain.x}px; bottom: ${gameHeight - terrain.y}px; width: ${terrain.width}px; height: ${terrain.height}px; background-color: ${terrain.color};">
                <div class="pillar-top"></div>
              </div>
            `;
          case 'rock':
            return `
              <div class="terrain rock" style="left: ${terrain.x}px; bottom: ${gameHeight - terrain.y}px; width: ${terrain.width}px; height: ${terrain.height}px; background-color: ${terrain.color};">
                <div class="rock-shape"></div>
              </div>
            `;
          default:
            return '';
        }
      }).join('');
    }

    function updateInventory() {
      const inventoryItems = document.getElementById('inventoryItems');
      if (player.inventory.length === 0) {
        inventoryItems.innerHTML = '<div class="empty-inventory">背包为空</div>';
      } else {
        inventoryItems.innerHTML = player.inventory.map(item => `
          <div class="inventory-item" style="border-color: ${item.getRarityColor()}" onclick="useItem('${item.id}')">
            ${item.icon}
          </div>
        `).join('');
      }
    }

    function updateDirectionHints() {
      const hints = document.getElementById('directionHints');
      const adjacent = dungeon.getAdjacentRooms();
      const canMove = { up: false, down: false, left: false, right: false };
      
      adjacent.forEach(adj => {
        if (adj.room && dungeon.currentRoom.isRoomCleared()) {
          canMove[adj.direction] = true;
        }
      });

      hints.innerHTML = '';
      const directions = ['up', 'down', 'left', 'right'];
      const icons = { up: '⬆️', down: '⬇️', left: '⬅️', right: '➡️' };
      directions.forEach(dir => {
        if (canMove[dir]) {
          const hint = document.createElement('div');
          hint.className = 'direction-hint';
          hint.textContent = icons[dir];
          hint.onclick = () => moveRoom(dir);
          hints.appendChild(hint);
        }
      });
    }

    // 战斗操作 - 近距离拳击
    function playerAttackLeft() {
      if (!player.attack()) return;
      
      isPlayerAttacking = true;
      isAttackingLeft = true;
      
      // 检测左侧附近的敌人并造成伤害
      const enemyHit = checkMeleeHit(true);
      // 只有没有击中敌人才显示手部特效
      if (!enemyHit) {
        createAttackEffect();
      }
      
      setTimeout(() => {
        isPlayerAttacking = false;
        isAttackingLeft = false;
      }, player.attackTimer);
    }

    function playerAttackRight() {
      if (!player.attack()) return;
      
      isPlayerAttacking = true;
      isAttackingLeft = false;
      
      // 检测右侧附近的敌人并造成伤害
      const enemyHit = checkMeleeHit(false);
      // 只有没有击中敌人才显示手部特效
      if (!enemyHit) {
        createAttackEffect();
      }
      
      setTimeout(() => {
        isPlayerAttacking = false;
      }, player.attackTimer);
    }
    
    // 统一的攻击函数
    function playerAttack() {
      if (!player.attack()) return;
      
      isPlayerAttacking = true;
      isAttackingLeft = !player.facingRight;
      
      // 检测附近的敌人并造成伤害
      const enemyHit = checkMeleeHit(!player.facingRight);
      // 只有没有击中敌人才显示手部特效
      if (!enemyHit) {
        createAttackEffect();
      }
      
      setTimeout(() => {
        isPlayerAttacking = false;
      }, player.attackTimer);
    }

    function checkMeleeHit(isLeft) {
      const room = dungeon.currentRoom;
      const attackRange = 90; // 扩大攻击范围到90像素
      const playerCenter = player.x + player.width / 2;
      
      for (let enemy of room.enemies) {
        if (!enemy.isAlive || !enemy.x) continue;
        
        // 计算敌人中心位置
        const enemyCenter = enemy.x + (enemy.width || 45) / 2;
        // 计算与玩家中心的水平距离
        const dx = enemyCenter - playerCenter;
        const distance = Math.abs(dx);
        
        // 检查是否在攻击范围内，增加容错空间
        if (isLeft) {
          // 向左攻击：敌人在玩家左侧且在攻击范围内
          if (dx < 0 && distance < attackRange + 10) {
            dealMeleeDamage(enemy);
            // 在敌人位置创建攻击特效
            createAttackEffectAtEnemy(enemy, isLeft);
            return true; // 击中敌人
          }
        } else {
          // 向右攻击：敌人在玩家右侧且在攻击范围内
          if (dx > 0 && distance < attackRange + player.width + 10) {
            dealMeleeDamage(enemy);
            // 在敌人位置创建攻击特效
            createAttackEffectAtEnemy(enemy, isLeft);
            return true; // 击中敌人
          }
        }
        
        // 额外的宽范围判定，确保不会漏掉敌人
        if (distance < attackRange + 20) {
          // 检查敌人是否在玩家的攻击方向上
          const enemyX = enemy.x;
          const enemyRight = enemyX + (enemy.width || 45);
          const playerRight = player.x + player.width;
          
          if ((isLeft && enemyX < player.x && enemyRight > player.x - attackRange) ||
              (!isLeft && enemyRight > playerRight && enemyX < playerRight + attackRange)) {
            dealMeleeDamage(enemy);
            createAttackEffectAtEnemy(enemy, isLeft);
            return true;
          }
        }
      }
      return false; // 没有击中敌人
    }

    function dealMeleeDamage(enemy) {
      const damage = player.getTotalAttack() * player.getCritMultiplier();
      const isDead = enemy.takeDamage(damage);
      
      if (isDead) {
        kills++;
        score += enemy.stats.expReward;
        playerExp += enemy.stats.expReward;
        player.addGold(enemy.stats.rewardGold);
        checkGateUnlock();
        
        // 创建死亡特效
        createDeathEffect(enemy.x, enemy.y);
      }
      
      // 创建击中特效
      const hitEffect = document.createElement('div');
      hitEffect.className = 'hit-effect';
      hitEffect.style.left = enemy.x + 'px';
      hitEffect.style.top = enemy.y + 'px';
      document.getElementById('gameArea').appendChild(hitEffect);
      
      // 创建爆炸粒子
      for (let i = 0; i < 3; i++) {
        const particle = document.createElement('div');
        particle.className = 'explosion-particle';
        particle.style.left = enemy.x + 15 + Math.random() * 10 + 'px';
        particle.style.top = enemy.y + 15 + Math.random() * 10 + 'px';
        particle.style.animationDelay = i * 0.05 + 's';
        document.getElementById('gameArea').appendChild(particle);
        
        setTimeout(() => particle.remove(), 500);
      }
      
      setTimeout(() => hitEffect.remove(), 300);
    }



    function createAttackEffect() {
      const playerElement = document.getElementById('player');
      const playerRect = playerElement.getBoundingClientRect();
      const gameArea = document.getElementById('gameArea');
      const gameRect = gameArea.getBoundingClientRect();
      
      // 创建手部攻击特效
      const handEffect = document.createElement('div');
      handEffect.className = 'hand-attack-effect';
      // 转换为游戏区域内的坐标
      const handLeft = isAttackingLeft ? 
        (playerRect.left - gameRect.left) - 10 : 
        (playerRect.right - gameRect.left) - 20;
      handEffect.style.left = handLeft + 'px';
      handEffect.style.top = (playerRect.top - gameRect.top) + playerRect.height / 2 + 10 + 'px';
      gameArea.appendChild(handEffect);
      
      // 创建攻击轨迹特效
      const slash = document.createElement('div');
      slash.className = 'slash-effect';
      const slashLeft = isAttackingLeft ? 
        (playerRect.left - gameRect.left) - 30 : 
        (playerRect.right - gameRect.left);
      slash.style.left = slashLeft + 'px';
      slash.style.top = (playerRect.top - gameRect.top) + playerRect.height / 2 + 'px';
      gameArea.appendChild(slash);
      
      setTimeout(() => {
        handEffect.remove();
        slash.remove();
      }, 400);
    }
    
    // 在敌人位置创建攻击特效
    function createAttackEffectAtEnemy(enemy, isLeft) {
      const gameArea = document.getElementById('gameArea');
      const enemyWidth = 40; // 敌人宽度
      const enemyHeight = 60; // 敌人高度
      
      // 计算敌人中心位置
      const centerX = enemy.x + enemyWidth / 2 - 40; // 特效宽度的一半
      const centerY = enemy.y - enemyHeight / 2 - 20; // 特效高度的一半
      
      // 创建主要攻击特效（在敌人中心）
      const mainEffect = document.createElement('div');
      mainEffect.className = 'slash-effect';
      mainEffect.style.left = centerX + 'px';
      mainEffect.style.top = centerY + 'px';
      // 根据攻击方向调整
      mainEffect.style.transform = isLeft ? 'scaleX(1)' : 'scaleX(1)';
      gameArea.appendChild(mainEffect);
      
      // 创建额外的爆炸效果
      for (let i = 0; i < 2; i++) {
        const extraEffect = document.createElement('div');
        extraEffect.className = 'hand-attack-effect';
        extraEffect.style.left = centerX - 20 + Math.random() * 40 + 'px';
        extraEffect.style.top = centerY - 20 + Math.random() * 40 + 'px';
        extraEffect.style.transform = `scale(${0.8 + Math.random() * 0.4})`;
        extraEffect.style.animationDelay = i * 0.1 + 's';
        gameArea.appendChild(extraEffect);
        
        setTimeout(() => extraEffect.remove(), 400);
      }
      
      setTimeout(() => {
        mainEffect.remove();
      }, 400);
    }

    function moveLeft() {
      player.facingRight = false;
    }

    function moveRight() {
      player.facingRight = true;
    }

    function moveUp() {}
    function moveDown() {}

    function stopMove() {
      isMovingLeft = false;
      isMovingRight = false;
    }
    
    // 第二个handleMovement函数已被移除，使用第一个完整的版本

    function playerJump() {
      // 如果在下落攻击中，不能跳跃
      if (isFallingAttack) return;
      
      // 如果在地面，第一段跳
      if (!isJumping && !player.isJumping) {
        isJumping = true;
        player.isJumping = true;
        doubleJumpAvailable = true; // 允许二段跳
        
        // 获取角色元素
        const playerElement = document.getElementById('player');
        const pixelCharacter = playerElement.querySelector('.pixel-character');
        
        // 清除之前的动画类
        pixelCharacter.classList.remove('jumping');
        void pixelCharacter.offsetWidth; // 触发重绘
        
        // 添加跳跃动画类
        pixelCharacter.classList.add('jumping');
        
        // 应用跳跃力
        player.y -= 40; // 立即向上移动，匹配跳跃高度
        
        // 更新玩家位置显示
        playerElement.style.bottom = player.y + 'px';
        
        // 落地
        setTimeout(() => {
          // 移除跳跃动画类
          pixelCharacter.classList.remove('jumping');
          
          // 立即落地
          isJumping = false;
          player.isJumping = false;
          doubleJumpAvailable = false; // 落地后重置二段跳
          player.y += 40; // 恢复位置
          playerElement.style.bottom = player.y + 'px';
          
          // 确保跳跃状态完全重置
          setTimeout(() => {
            isJumping = false;
            player.isJumping = false;
            // 强制设置玩家位置到地面
            player.y = 60;
            playerElement.style.bottom = '60px';
          }, 50);
        }, 700);
      } 
      // 如果在空中且有二段跳可用，二段跳
      else if (isJumping && player.isJumping && doubleJumpAvailable) {
        doubleJumpAvailable = false; // 消耗二段跳
        
        // 获取角色元素
        const playerElement = document.getElementById('player');
        const pixelCharacter = playerElement.querySelector('.pixel-character');
        
        // 清除之前的动画类
        pixelCharacter.classList.remove('jumping');
        void pixelCharacter.offsetWidth; // 触发重绘
        
        // 添加二段跳动画类
        pixelCharacter.classList.add('jumping');
        
        // 应用二段跳力
        player.y -= 35; // 二段跳高度稍低于第一段
        
        // 更新玩家位置显示
        playerElement.style.bottom = player.y + 'px';
        
        // 播放二段跳特效
        createDoubleJumpEffect();
      }
    }
    
    // 创建二段跳特效
    function createDoubleJumpEffect() {
      const playerElement = document.getElementById('player');
      const gameArea = document.getElementById('gameArea');
      
      // 创建二段跳特效
      const effect = document.createElement('div');
      effect.className = 'double-jump-effect';
      effect.style.left = (parseInt(playerElement.style.left) + 20) + 'px';
      effect.style.bottom = (player.y - 20) + 'px';
      
      gameArea.appendChild(effect);
      
      // 特效结束后移除
      setTimeout(() => effect.remove(), 300);
    }

    function startAttack() {
      playerAttack();
    }

    function stopAttack() {}
    
    // 下落攻击
    function startFallingAttack() {
      // 只有在空中且不在下落攻击中才能触发
      if ((isJumping || player.isJumping) && !isFallingAttack && player.y > 60) {
        isFallingAttack = true;
        
        // 获取角色元素
        const playerElement = document.getElementById('player');
        const pixelCharacter = playerElement.querySelector('.pixel-character');
        
        // 添加下落攻击动画
        pixelCharacter.classList.add('falling-attack');
        
        // 加速下落
        const fallInterval = setInterval(() => {
          if (player.y <= 60) {
            clearInterval(fallInterval);
            // 落地
            landFallingAttack();
          } else {
            player.y -= 8; // 加速下落
            playerElement.style.bottom = player.y + 'px';
          }
        }, 16);
      }
    }
    
    // 落地触发攻击效果
    function landFallingAttack() {
      isFallingAttack = false;
      
      // 获取角色元素
      const playerElement = document.getElementById('player');
      const pixelCharacter = playerElement.querySelector('.pixel-character');
      
      // 移除下落攻击动画
      pixelCharacter.classList.remove('falling-attack');
      
      // 重置玩家位置到地面
      player.y = 60;
      playerElement.style.bottom = '60px';
      
      // 重置跳跃状态
      isJumping = false;
      player.isJumping = false;
      doubleJumpAvailable = false;
      
      // 创建落地特效
      createLandingEffect();
      
      // 造成伤害和击退
      applyFallingAttackDamage();
    }
    
    // 创建落地特效
    function createLandingEffect() {
      const playerElement = document.getElementById('player');
      const gameArea = document.getElementById('gameArea');
      
      // 创建落地特效
      const effect = document.createElement('div');
      effect.className = 'landing-effect';
      effect.style.left = (parseInt(playerElement.style.left) - 40) + 'px';
      effect.style.bottom = '40px';
      
      gameArea.appendChild(effect);
      
      // 特效结束后移除
      setTimeout(() => effect.remove(), 800);
    }
    
    // 应用下落攻击伤害和击退
    function applyFallingAttackDamage() {
      // 查找附近的敌人
      const enemies = document.querySelectorAll('.enemy');
      const playerX = parseInt(document.getElementById('player').style.left);
      
      enemies.forEach(enemy => {
        const enemyX = parseInt(enemy.style.left);
        const distance = Math.abs(enemyX - playerX);
        
        // 对范围内的敌人造成伤害和击退
        if (distance < 150) {
          // 造成高额伤害
          const enemyHealth = enemy.querySelector('.enemy-health-fill');
          if (enemyHealth) {
            const currentWidth = parseInt(enemyHealth.style.width || '100');
            const newWidth = Math.max(0, currentWidth - 40); // 造成40%伤害
            enemyHealth.style.width = newWidth + '%';
            
            // 如果敌人死亡
            if (newWidth <= 0) {
              enemy.classList.add('enemy-dead');
              setTimeout(() => enemy.remove(), 500);
            }
          }
          
          // 击退敌人
          const direction = enemyX > playerX ? 1 : -1;
          enemy.style.left = (enemyX + direction * 80) + 'px';
          
          // 添加击退动画
          enemy.classList.add('knockback');
          setTimeout(() => enemy.classList.remove('knockback'), 300);
        }
      });
    }

    function jump() {
      playerJump();
    }

    // 物品操作
    function collectItem(itemId) {
      const room = dungeon.currentRoom;
      const itemIndex = room.items.findIndex(i => i.id === itemId);
      if (itemIndex === -1) return;
      
      const item = room.items[itemIndex];
      if (item.type === 'weapon') {
        player.equipWeapon(item);
      } else {
        player.addItem(item);
      }
      room.items.splice(itemIndex, 1);
      updateUI();
    }



    function useItem(itemId) {
      const index = player.inventory.findIndex(i => i.id === itemId);
      if (index === -1) return;
      
      const item = player.inventory[index];
      if (item.type === 'potion') {
        switch (item.effect.type) {
          case 'health':
            player.heal(item.effect.value);
            break;
          case 'strength':
            player.stats.attack += item.effect.value;
            break;
          case 'defense':
            player.stats.defense += item.effect.value;
            break;
          case 'speed':
            player.stats.speed += item.effect.value;
            break;
          case 'crit':
            player.stats.critRate += item.effect.value / 100;
            break;
        }
        player.inventory.splice(index, 1);
        updateUI();
      }
    }

    // 房间移动
    function moveRoom(direction) {
      if (!dungeon.currentRoom.isRoomCleared()) return;
      dungeon.moveToRoom(direction);
      updateUI();
      
      if (dungeon.currentRoom.type === 'boss' && dungeon.currentRoom.enemies.every(e => !e.isAlive)) {
        showVictory();
      }
    }

    function rest() {
      player.heal(player.stats.maxHealth);
      updateUI();
    }

    // 游戏状态控制
    function resumeGame() {
      isPaused = false;
      document.getElementById('pauseOverlay').classList.remove('active');
    }

    function quitGame() {
      clearInterval(gameLoop);
      saveStats();
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('menuScreen').style.display = 'flex';
      loadGameData();
      updateMenuStats();
    }

    function restartGame() {
      clearInterval(gameLoop);
      document.getElementById('gameoverOverlay').classList.remove('active');
      startGame();
    }

    function showVictory() {
      isVictory = true;
      document.getElementById('victoryScore').textContent = score;
      document.getElementById('victoryOverlay').classList.add('active');
    }

    function nextFloor() {
      document.getElementById('victoryOverlay').classList.remove('active');
      dungeon.nextFloor();
      isVictory = false;
      updateUI();
    }

    function saveStats() {
      gameData.maxFloor = Math.max(gameData.maxFloor, dungeon.currentFloor);
      gameData.totalKills += kills;
      gameData.highScore = Math.max(gameData.highScore, score);
      gameData.gold += player.gold;
      saveGameData();
    }

    // 键盘控制
    function handleKeyDown(e) {
      switch (e.key) {
        case 'ArrowLeft':
        case 'a':
        case 'A':
          isMovingLeft = true;
          moveLeft();
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          isMovingRight = true;
          moveRight();
          break;
        case ' ':
        case 'ArrowUp':
        case 'w':
        case 'W':
          playerJump();
          break;
        case 'j':
        case 'J':
          playerAttackLeft();
          break;
        case 'k':
        case 'K':
          playerAttackRight();
          break;
        case 'f':
        case 'F':
          enterNextFloor();
          break;
        case 'Escape':
          isPaused = !isPaused;
          document.getElementById('pauseOverlay').classList.toggle('active', isPaused);
          break;
      }
    }

    function handleKeyUp(e) {
      switch (e.key) {
        case 'ArrowLeft':
        case 'a':
        case 'A':
          isMovingLeft = false;
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          isMovingRight = false;
          break;
      }
    }

    // 触摸滑动控制
    let touchStartX = 0;
    let touchStartY = 0;

    function handleTouchStart(e) {
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }

    function handleTouchMove(e) {
      const touch = e.touches[0];
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;
      
      if (Math.abs(deltaX) > Math.abs(deltaY)) {
        if (deltaX > 30) {
          moveRight();
        } else if (deltaX < -30) {
          moveLeft();
        }
      }
    }

    // 初始化事件监听
    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);
    
    // 页面加载完成后初始化
    window.addEventListener('load', init);
    
    // 暴露全局函数
    window.startGame = startGame;
    window.restartGame = restartGame;
    window.quitGame = quitGame;
    window.jump = jump;
    window.startAttack = startAttack;
    window.stopAttack = stopAttack;
  </script>
</body>
</html>
