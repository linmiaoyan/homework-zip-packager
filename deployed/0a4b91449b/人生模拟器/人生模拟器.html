<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命运之轮 - 人生模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        /* 动态五彩斑斓背景 */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg,
                    #1a1a2e 0%,
                    #16213e 15%,
                    #2d1b69 30%,
                    #1a1a2e 45%,
                    #0f3460 60%,
                    #1e3a5f 75%,
                    #1a1a2e 90%,
                    #16213e 100%);
            z-index: 0;
            animation: gradientShift 15s ease infinite;
            background-size: 800% 800%;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 25% 75%;
            }

            50% {
                background-position: 50% 25%;
            }

            75% {
                background-position: 75% 75%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        /* 多色背景光效 */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow::before {
            content: '';
            position: absolute;
            top: -20%;
            left: 20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse at center, rgba(233, 69, 96, 0.2) 0%, transparent 70%);
            animation: glowPulse 6s ease-in-out infinite;
            filter: blur(40px);
        }

        .bg-glow::after {
            content: '';
            position: absolute;
            bottom: -20%;
            right: 10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(ellipse at center, rgba(52, 152, 219, 0.18) 0%, transparent 70%);
            animation: glowPulse 8s ease-in-out infinite reverse;
            filter: blur(40px);
        }

        .bg-glow .glow-1 {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background: radial-gradient(ellipse at center, rgba(155, 89, 182, 0.15) 0%, transparent 70%);
            animation: glowRotate 20s linear infinite;
            filter: blur(60px);
        }

        .bg-glow .glow-2 {
            content: '';
            position: absolute;
            top: 10%;
            right: 20%;
            width: 40%;
            height: 40%;
            background: radial-gradient(ellipse at center, rgba(46, 204, 113, 0.12) 0%, transparent 70%);
            animation: glowFloat 12s ease-in-out infinite;
            filter: blur(30px);
        }

        .bg-glow .glow-3 {
            content: '';
            position: absolute;
            bottom: 10%;
            left: 10%;
            width: 35%;
            height: 35%;
            background: radial-gradient(ellipse at center, rgba(241, 196, 15, 0.14) 0%, transparent 70%);
            animation: glowFloat 15s ease-in-out infinite reverse;
            filter: blur(35px);
        }

        .bg-glow .glow-4 {
            content: '';
            position: absolute;
            top: 70%;
            left: 60%;
            width: 45%;
            height: 45%;
            background: radial-gradient(ellipse at center, rgba(231, 76, 60, 0.1) 0%, transparent 70%);
            animation: glowPulse 10s ease-in-out infinite;
            filter: blur(45px);
        }

        @keyframes glowPulse {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        @keyframes glowRotate {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        @keyframes glowFloat {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-20px) scale(1.1);
            }
        }

        /* 背景粒子 */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(100vh) rotate(0deg) scale(0);
                opacity: 0;
            }

            5% {
                opacity: 1;
                transform: scale(1);
            }

            95% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) rotate(360deg) scale(0);
                opacity: 0;
            }
        }

        /* 星星效果 */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        #gameContainer {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* 开始界面 */
        #startScreen {
            text-align: center;
            padding: 120px 20px;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #startScreen h1 {
            font-size: 80px;
            margin-bottom: 25px;
            background: linear-gradient(90deg, #e94560, #f39c12, #2ecc71, #3498db, #9b59b6);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowShift 5s ease infinite;
            text-shadow: 0 0 60px rgba(233, 69, 96, 0.5);
            filter: drop-shadow(0 0 30px rgba(243, 156, 18, 0.4));
            letter-spacing: 8px;
            font-weight: 800;
        }

        @keyframes rainbowShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        #startScreen .subtitle {
            font-size: 24px;
            color: #f39c12;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        #startScreen p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 50px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            line-height: 2;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn {
            padding: 25px 80px;
            font-size: 28px;
            background: linear-gradient(135deg, #e94560, #ff6b6b, #f39c12, #2ecc71, #3498db, #9b59b6);
            background-size: 400% 400%;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin: 15px;
            position: relative;
            overflow: hidden;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 15px 40px rgba(233, 69, 96, 0.5), 0 0 0 1px rgba(233, 69, 96, 0.3);
            animation: btnGlow 3s ease infinite, btnRainbow 8s ease infinite;
        }

        @keyframes btnGlow {

            0%,
            100% {
                box-shadow: 0 15px 40px rgba(233, 69, 96, 0.5), 0 0 0 1px rgba(233, 69, 96, 0.3);
            }

            25% {
                box-shadow: 0 20px 50px rgba(34, 193, 195, 0.6), 0 0 20px rgba(34, 193, 195, 0.4);
            }

            50% {
                box-shadow: 0 25px 55px rgba(243, 156, 18, 0.6), 0 0 30px rgba(233, 69, 96, 0.4);
            }

            75% {
                box-shadow: 0 20px 50px rgba(155, 89, 182, 0.6), 0 0 20px rgba(155, 89, 182, 0.4);
            }
        }

        @keyframes btnRainbow {
            0% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 25% 75%;
            }

            50% {
                background-position: 50% 25%;
            }

            75% {
                background-position: 75% 75%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            transition: left 0.7s;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover::after {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            transform: translateY(-10px) scale(1.1);
            box-shadow: 0 30px 70px rgba(233, 69, 96, 0.7), 0 0 40px rgba(243, 156, 18, 0.3), 0 0 60px rgba(34, 193, 195, 0.2);
            background-position: 100% 50%;
        }

        .btn:active {
            transform: translateY(-5px) scale(1.05);
        }

        /* 音乐控制按钮 */
        .music-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: rgba(233, 69, 96, 0.3);
            border-color: #e94560;
        }

        /* 特质选择界面 */
        #traitSelection {
            display: none;
            padding: 40px 20px;
            animation: fadeIn 0.6s ease-in;
        }

        #traitSelection h2 {
            text-align: center;
            font-size: 48px;
            margin-bottom: 20px;
            color: #f39c12;
            background: linear-gradient(90deg, #f39c12, #e94560, #9b59b6);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowShift 4s ease infinite;
            text-shadow: 0 0 40px rgba(243, 156, 18, 0.3);
        }

        #traitSelection p {
            text-align: center;
            color: #ccc;
            margin-bottom: 50px;
            font-size: 20px;
            line-height: 1.8;
        }

        .trait-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto 40px;
        }

        .trait-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
            border-radius: 35px;
            padding: 40px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .trait-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #f39c12, #e94560, #9b59b6, #3498db, #2ecc71);
            background-size: 400% 100%;
            opacity: 0;
            transform: scaleX(0);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: left;
            animation: rainbowBorder 5s ease infinite;
        }

        @keyframes rainbowBorder {
            0% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 25% 75%;
            }

            50% {
                background-position: 50% 25%;
            }

            75% {
                background-position: 75% 75%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        .trait-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(243, 156, 18, 0.18) 0%, rgba(233, 69, 96, 0.1) 50%, transparent 70%);
            opacity: 0;
            transition: all 0.5s ease;
        }

        .trait-card .glow-spot {
            position: absolute;
            top: 20%;
            left: 10%;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, rgba(243, 156, 18, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            transition: all 0.5s ease;
        }

        .trait-card:hover::before {
            opacity: 1;
            transform: scaleX(1);
        }

        .trait-card:hover::after {
            opacity: 1;
            transform: rotate(30deg);
        }

        .trait-card:hover {
            transform: translateY(-15px) scale(1.04);
            box-shadow: 0 35px 80px rgba(243, 156, 18, 0.3), 0 0 0 1px rgba(243, 156, 18, 0.2);
            border-color: rgba(243, 156, 18, 0.5);
        }

        .trait-card.selected {
            border-color: #f39c12;
            background: linear-gradient(145deg, rgba(243, 156, 18, 0.18), rgba(233, 69, 96, 0.12));
            box-shadow: 0 0 60px rgba(243, 156, 18, 0.5), inset 0 0 30px rgba(243, 156, 18, 0.1);
            animation: traitPulse 2.5s ease-in-out infinite;
        }

        @keyframes traitPulse {

            0%,
            100% {
                box-shadow: 0 0 30px rgba(243, 156, 18, 0.4);
                transform: translateY(-5px);
            }

            50% {
                box-shadow: 0 0 60px rgba(233, 69, 96, 0.5);
                transform: translateY(-8px);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 30px rgba(46, 204, 113, 0.4);
            }

            50% {
                box-shadow: 0 0 50px rgba(46, 204, 113, 0.6);
            }
        }

        .trait-card.talent {
            border-color: rgba(46, 204, 113, 0.3);
        }

        .trait-card.flaw {
            border-color: rgba(231, 76, 60, 0.3);
        }

        .trait-card .trait-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .trait-card .trait-icon {
            font-size: 28px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }

        .trait-card .trait-name {
            font-size: 22px;
            font-weight: bold;
        }

        .trait-card.talent .trait-name {
            color: #2ecc71;
        }

        .trait-card.flaw .trait-name {
            color: #e74c3c;
        }

        .trait-card .trait-effect {
            font-size: 15px;
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .trait-card .trait-count {
            font-size: 13px;
            color: #666;
            text-align: right;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #traitButtons {
            text-align: center;
            margin-top: 40px;
        }

        #traitButtons .btn {
            margin: 15px;
        }

        #traitButtons .btn:nth-child(2) {
            background: linear-gradient(135deg, #3498db, #2980b9);
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.4);
        }

        #traitButtons .btn:nth-child(2):hover {
            box-shadow: 0 20px 50px rgba(52, 152, 219, 0.6);
        }

        /* 角色创建界面 */
        #characterCreation {
            display: none;
            padding: 40px 20px;
            animation: fadeIn 0.6s ease-in;
        }

        #characterCreation h2 {
            text-align: center;
            font-size: 40px;
            margin-bottom: 35px;
            color: #f39c12;
            background: linear-gradient(90deg, #f39c12, #e94560);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 属性卡片 */
        #attributesDisplay {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 900px;
            margin: 0 auto 40px;
        }

        .attribute-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
            border-radius: 35px;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .attribute-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.15) 0%, rgba(233, 69, 96, 0.1) 50%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s, transform 0.5s;
        }

        .attribute-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 80%;
            height: 4px;
            background: linear-gradient(90deg, #e94560, #f39c12, #2ecc71, #3498db, #9b59b6);
            background-size: 400% 100%;
            opacity: 0;
            transition: opacity 0.5s;
            animation: attrBarGlow 5s ease infinite;
        }

        .attribute-card .rainbow-border {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 35px;
            padding: 2px;
            background: linear-gradient(135deg, #e94560, #f39c12, #2ecc71, #3498db, #9b59b6);
            background-size: 400% 400%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rainbowShift 6s ease infinite;
            opacity: 0;
            transition: opacity 0.5s;
        }

        @keyframes attrBarGlow {
            0% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 25% 75%;
            }

            50% {
                background-position: 50% 25%;
            }

            75% {
                background-position: 75% 75%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        .attribute-card:hover::before {
            opacity: 1;
            transform: scale(1.1);
        }

        .attribute-card:hover::after {
            opacity: 1;
        }

        .attribute-card:hover .rainbow-border {
            opacity: 1;
        }

        .attribute-card:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.5), 0 0 40px rgba(233, 69, 96, 0.2), 0 0 60px rgba(155, 89, 182, 0.1);
            border-color: rgba(233, 69, 96, 0.5);
        }

        .attribute-card .icon {
            font-size: 45px;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
        }

        .attribute-card .name {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 500;
        }

        .attribute-card .value {
            font-size: 56px;
            font-weight: bold;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(52, 152, 219, 0.3);
        }

        /* 出生信息 */
        #birthInfo {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 40px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        #birthInfo p {
            font-size: 17px;
            line-height: 2.2;
            color: #ddd;
        }

        #birthInfo strong {
            color: #f39c12;
            font-weight: 600;
        }

        #birthInfo .talent-text {
            color: #2ecc71;
        }

        #birthInfo .flaw-text {
            color: #e74c3c;
        }

        #characterCreation .btn-container {
            text-align: center;
        }

        /* 游戏主界面 */
        #gameScreen {
            display: none;
            animation: fadeIn 0.6s ease-in;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        #ageDisplay {
            font-size: 32px;
        }

        #ageDisplay .age {
            font-size: 72px;
            font-weight: bold;
            background: linear-gradient(90deg, #f39c12, #e94560);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(243, 156, 18, 0.4);
        }

        #phaseDisplay {
            font-size: 26px;
            color: #2ecc71;
            padding: 15px 35px;
            background: rgba(46, 204, 113, 0.15);
            border-radius: 40px;
            border: 2px solid rgba(46, 204, 113, 0.3);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #yearProgress {
            font-size: 20px;
            color: #aaa;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
        }

        #yearNumber {
            color: #f39c12;
            font-weight: bold;
            font-size: 24px;
        }

        #statsPanel {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 25px;
            margin-bottom: 35px;
        }

        .stat-bar {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-bar::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(243, 156, 18, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .stat-bar:hover::before {
            opacity: 1;
        }

        .stat-bar:hover {
            transform: translateY(-8px) scale(1.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(243, 156, 18, 0.2);
            border-color: rgba(243, 156, 18, 0.3);
        }

        .stat-bar .label {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .stat-bar .bar-container {
            height: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
        }

        .stat-bar .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71, #f39c12);
            background-size: 200% 100%;
            transition: width 0.6s ease-out;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            animation: barGlow 3s infinite;
        }

        @keyframes barGlow {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .stat-bar .bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(200%);
            }
        }

        .stat-bar .value {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        #storyPanel {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
            border-radius: 40px;
            padding: 80px;
            margin-bottom: 40px;
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        #storyPanel::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -40%;
            width: 90%;
            height: 90%;
            background: radial-gradient(circle, rgba(233, 69, 96, 0.15) 0%, transparent 60%);
            animation: storyGlow 6s ease-in-out infinite;
        }

        #storyPanel::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -30%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.1) 0%, transparent 60%);
            animation: storyGlow 8s ease-in-out infinite reverse;
        }

        @keyframes storyGlow {

            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        #storyText {
            font-size: 26px;
            line-height: 2.4;
            margin-bottom: 50px;
            color: #f0f0f0;
            text-align: center;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            font-weight: 500;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        #choicesPanel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .choice-btn {
            padding: 38px;
            font-size: 24px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: left;
            position: relative;
            overflow: hidden;
            font-weight: 600;
            backdrop-filter: blur(20px);
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(233, 69, 96, 0.5), transparent);
            transition: left 0.8s ease;
        }

        .choice-btn::after {
            content: '→';
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%) translateX(25px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 28px;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .choice-btn:hover::before {
            left: 100%;
        }

        .choice-btn:hover::after {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        .choice-btn:hover {
            background: linear-gradient(145deg, rgba(233, 69, 96, 0.25), rgba(233, 69, 96, 0.1));
            border-color: #e94560;
            transform: translateX(20px) scale(1.02);
            box-shadow: 0 25px 60px rgba(233, 69, 96, 0.4), 0 0 0 1px rgba(233, 69, 96, 0.3);
        }

        .choice-btn:active {
            transform: translateX(10px) scale(1.01);
        }

        /* 事件弹窗 */
        #eventModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.4s ease-in;
            backdrop-filter: blur(10px);
        }

        #eventModal .content {
            background: linear-gradient(145deg, #1a1a2e, #16213e, #0f3460);
            border-radius: 40px;
            padding: 70px;
            max-width: 750px;
            text-align: center;
            border: 2px solid #f39c12;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.7), 0 0 60px rgba(243, 156, 18, 0.15);
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        #eventModal .content::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(243, 156, 18, 0.15) 0%, transparent 70%);
            animation: modalGlow 4s ease-in-out infinite;
        }

        #eventModal .content::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.1) 0%, transparent 70%);
            animation: modalGlow 5s ease-in-out infinite reverse;
        }

        @keyframes modalGlow {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        #eventModal h3 {
            font-size: 36px;
            margin-bottom: 25px;
            background: linear-gradient(90deg, #f39c12, #e94560);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
        }

        #eventModal p {
            font-size: 20px;
            line-height: 2.2;
            margin-bottom: 40px;
            color: #ddd;
        }

        #eventModal .event-btn {
            padding: 18px 50px;
            font-size: 20px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #fff;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(243, 156, 18, 0.4);
        }

        #eventModal .event-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 20px 50px rgba(243, 156, 18, 0.6);
        }

        /* 结局界面 */
        #endingScreen {
            display: none;
            padding: 60px 20px;
            animation: fadeIn 0.6s ease-in;
        }

        #endingScreen h1 {
            font-size: 64px;
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(90deg, #e94560, #f39c12, #2ecc71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowShift 4s ease infinite;
        }

        #endingScreen .ending-type {
            font-size: 32px;
            padding: 20px 50px;
            display: inline-block;
            border-radius: 50px;
            margin-bottom: 50px;
            margin-left: 50%;
            transform: translateX(-50%);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .legendary {
            background: linear-gradient(90deg, #ffd700, #ffec8b, #ffd700);
            color: #1a1a2e;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.6);
            background-size: 200% 100%;
            animation: legendaryGlow 2s ease infinite;
        }

        @keyframes legendaryGlow {

            0%,
            100% {
                box-shadow: 0 0 50px rgba(255, 215, 0, 0.6);
            }

            50% {
                box-shadow: 0 0 80px rgba(255, 215, 0, 0.9);
            }
        }

        .fulfilling {
            background: linear-gradient(90deg, #2ecc71, #55efc4);
            color: #1a1a2e;
            box-shadow: 0 0 40px rgba(46, 204, 113, 0.5);
        }

        .ordinary {
            background: linear-gradient(90deg, #95a5a6, #bdc3c7);
            color: #1a1a2e;
            box-shadow: 0 0 30px rgba(149, 165, 166, 0.4);
        }

        .regretful {
            background: linear-gradient(90deg, #f39c12, #fdcb6e);
            color: #1a1a2e;
            box-shadow: 0 0 30px rgba(243, 156, 18, 0.5);
        }

        .tragic {
            background: linear-gradient(90deg, #e74c3c, #ff6b6b);
            color: #fff;
            box-shadow: 0 0 40px rgba(231, 76, 60, 0.6);
        }

        #endingSummary {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            padding: 50px;
            margin-bottom: 40px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #endingSummary h3 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #f39c12;
            text-align: center;
            font-weight: 600;
        }

        #endingSummary .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 20px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            font-size: 18px;
        }

        #endingSummary .stat-item:hover {
            background: rgba(255, 255, 255, 0.05);
            padding-left: 35px;
        }

        #endingSummary .stat-item span:first-child {
            color: #aaa;
        }

        #endingSummary .stat-item span:last-child {
            color: #fff;
            font-weight: bold;
            font-size: 20px;
        }

        #endingAchievements {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            padding: 50px;
            margin-bottom: 50px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #endingAchievements h3 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #f39c12;
            text-align: center;
            font-weight: 600;
        }

        #achievementsList {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .achievement-tag {
            padding: 15px 30px;
            background: rgba(46, 204, 113, 0.15);
            border: 2px solid #2ecc71;
            border-radius: 40px;
            color: #2ecc71;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .achievement-tag::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(46, 204, 113, 0.2), transparent);
            transition: left 0.5s;
        }

        .achievement-tag:hover::before {
            left: 100%;
        }

        .achievement-tag:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.4);
        }

        #endingScreen .btn {
            display: block;
            margin: 0 auto;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #e94560, #f39c12);
            border-radius: 6px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            #statsPanel {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            #attributesDisplay {
                grid-template-columns: repeat(2, 1fr);
            }

            #statsPanel {
                grid-template-columns: repeat(2, 1fr);
            }

            #choicesPanel {
                grid-template-columns: 1fr;
            }

            .trait-container {
                grid-template-columns: 1fr;
            }

            #header {
                flex-direction: column;
                gap: 20px;
            }

            #ageDisplay .age {
                font-size: 56px;
            }

            #endingScreen h1 {
                font-size: 48px;
            }
        }

        @media (max-width: 480px) {
            #attributesDisplay {
                grid-template-columns: 1fr;
            }

            #statsPanel {
                grid-template-columns: 1fr;
            }

            .btn {
                padding: 15px 30px;
                font-size: 18px;
            }

            #startScreen h1 {
                font-size: 48px;
            }
        }
    </style>
</head>

<body>
    <!-- 动态背景 -->
    <div class="bg-gradient"></div>

    <!-- 背景光效 -->
    <div class="bg-glow"></div>

    <!-- 背景粒子 -->
    <div class="bg-particles" id="particles"></div>

    <!-- 背景音乐 -->
    <audio id="bgMusic" loop>
        <source src="Wind_hill.mp3" type="audio/mpeg">
    </audio>

    <!-- 音乐控制按钮 -->
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🔊</button>

    <div id="gameContainer">
        <!-- 开始界面 -->
        <div id="startScreen">
            <h1>命运之轮</h1>
            <div class="subtitle">Life Simulator</div>
            <p>每一个选择都将塑造你的命运。从出生到死亡，体验一段完整的人生旅程。你的选择将决定你成为什么样的人。</p>
            <button class="btn" onclick="startGame()">🎲 开始新人生</button>
        </div>

        <!-- 特质选择界面 -->
        <div id="traitSelection">
            <h2>🌟 选择你的特质</h2>
            <p>请从下方的特质中选择 <strong>2个天赋</strong> 和 <strong class="flaw">1个缺陷</strong></p>

            <div class="trait-container">
                <div id="talentCards"></div>
            </div>

            <div id="traitButtons">
                <button class="btn" onclick="confirmTraits()">✅ 确认选择</button>
                <button class="btn" onclick="rerollTraits()">🔄 重新抽取</button>
            </div>
        </div>

        <!-- 角色创建界面 -->
        <div id="characterCreation">
            <h2>🎭 你的人生即将开始...</h2>

            <div id="attributesDisplay">
                <div class="attribute-card">
                    <div class="icon">🧠</div>
                    <div class="name">智力</div>
                    <div class="value" id="attr-intelligence">0</div>
                </div>
                <div class="attribute-card">
                    <div class="icon">💪</div>
                    <div class="name">体力</div>
                    <div class="value" id="attr-strength">0</div>
                </div>
                <div class="attribute-card">
                    <div class="icon">✨</div>
                    <div class="name">魅力</div>
                    <div class="value" id="attr-charm">0</div>
                </div>
                <div class="attribute-card">
                    <div class="icon">💰</div>
                    <div class="name">财富</div>
                    <div class="value" id="attr-wealth">0</div>
                </div>
                <div class="attribute-card">
                    <div class="icon">❤️</div>
                    <div class="name">健康</div>
                    <div class="value" id="attr-health">0</div>
                </div>
                <div class="attribute-card">
                    <div class="icon">🍀</div>
                    <div class="name">幸运</div>
                    <div class="value" id="attr-luck">0</div>
                </div>
            </div>

            <div id="birthInfo">
                <p id="birthText"></p>
            </div>

            <div class="btn-container">
                <button class="btn" onclick="startLife()">🚀 开启人生</button>
            </div>
        </div>

        <!-- 游戏主界面 -->
        <div id="gameScreen">
            <div id="header">
                <div id="ageDisplay">
                    <span class="age" id="currentAge">0</span> 岁
                </div>
                <div id="phaseDisplay">婴儿期</div>
                <div id="yearProgress">
                    第 <span id="yearNumber">1</span> 年
                </div>
            </div>

            <div id="statsPanel">
                <div class="stat-bar">
                    <div class="label">智力</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="stat-intelligence"></div>
                    </div>
                    <div class="value" id="val-intelligence">50</div>
                </div>
                <div class="stat-bar">
                    <div class="label">体力</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="stat-strength"></div>
                    </div>
                    <div class="value" id="val-strength">50</div>
                </div>
                <div class="stat-bar">
                    <div class="label">魅力</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="stat-charm"></div>
                    </div>
                    <div class="value" id="val-charm">50</div>
                </div>
                <div class="stat-bar">
                    <div class="label">财富</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="stat-wealth"></div>
                    </div>
                    <div class="value" id="val-wealth">50</div>
                </div>
                <div class="stat-bar">
                    <div class="label">健康</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="stat-health"></div>
                    </div>
                    <div class="value" id="val-health">50</div>
                </div>
                <div class="stat-bar">
                    <div class="label">幸运</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="stat-luck"></div>
                    </div>
                    <div class="value" id="val-luck">50</div>
                </div>
            </div>

            <div id="storyPanel">
                <div id="storyText"></div>
                <div id="choicesPanel"></div>
            </div>
        </div>

        <!-- 事件弹窗 -->
        <div id="eventModal">
            <div class="content">
                <h3 id="eventTitle"></h3>
                <p id="eventDescription"></p>
                <button class="event-btn" onclick="closeEventModal()">继续</button>
            </div>
        </div>

        <!-- 结局界面 -->
        <div id="endingScreen">
            <h1 id="endingTitle"></h1>
            <div class="ending-type" id="endingType"></div>

            <div id="endingSummary">
                <h3>📊 人生总结</h3>
                <div class="stat-item"><span>最终智力</span><span id="end-intelligence">0</span></div>
                <div class="stat-item"><span>最终体力</span><span id="end-strength">0</span></div>
                <div class="stat-item"><span>最终魅力</span><span id="end-charm">0</span></div>
                <div class="stat-item"><span>最终财富</span><span id="end-wealth">0</span></div>
                <div class="stat-item"><span>最终健康</span><span id="end-health">0</span></div>
                <div class="stat-item"><span>职业成就</span><span id="end-career">无</span></div>
                <div class="stat-item"><span>婚姻状况</span><span id="end-marriage">未婚</span></div>
                <div class="stat-item"><span>子女数量</span><span id="end-children">0</span></div>
                <div class="stat-item"><span>寿命</span><span id="end-age">0</span> 岁</div>
            </div>

            <div id="endingAchievements">
                <h3>🏆 人生成就</h3>
                <div id="achievementsList"></div>
            </div>

            <button class="btn" onclick="restartGame()">🔄 重新开始</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
